name: Build AutoFarm APK

on:
  push:
    paths:
      - "autofarm/**"
      - ".github/workflows/autofarm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autofarm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run simulator tests (bot logic on a fake game)
        run: |
          set -o pipefail
          mkdir -p build/sim
          javac -encoding UTF-8 -d build/sim $(find app/src/main/java/com/code02/autofarm/core sim/src -name '*.java')
          for main in $(grep -rl "public static void main" sim/src | sed 's|sim/src/||; s|\.java$||; s|/|.|g' | sort); do
            echo "=== $main ==="
            java -Dstdout.encoding=UTF-8 -cp build/sim "$main" | tee -a build/sim-report.txt
          done
          { echo '```'; cat build/sim-report.txt | grep -v "đang đánh …" | tail -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AutoFarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoFarm-apk
          path: AutoFarm.apk

      - name: Publish to release "autofarm-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autofarm-latest
          name: AutoFarm (bản mới nhất)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: AutoFarm.apk
          body: |
            Tải AutoFarm.apk về máy tính bảng Android rồi mở để cài.
            Xem hướng dẫn trong autofarm/README.md.
