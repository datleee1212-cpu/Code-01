plugins {
    id 'com.android.application'
}

android {
    namespace 'com.code02.autofarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.code02.autofarm'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
