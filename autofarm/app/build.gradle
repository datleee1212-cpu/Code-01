plugins {
    id 'com.android.application'
}

android {
    namespace 'com.code02.autofarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.code02.autofarm'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
    }

    // Khóa ký cố định: bản cập nhật cài đè được lên bản cũ, không mất dữ liệu đã dạy.
    // (App tự dùng, không đưa lên Play Store.)
    signingConfigs {
        debug {
            storeFile file('autofarm.keystore')
            storePassword 'autofarm'
            keyAlias 'autofarm'
            keyPassword 'autofarm'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Đọc chữ/số trên màn hình, mô hình đi kèm trong app (chạy offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
