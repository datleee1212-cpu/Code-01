plugins {
    id 'com.android.application'
}

android {
    namespace 'com.code02.autofarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.code02.autofarm'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Đọc chữ/số trên màn hình, mô hình đi kèm trong app (chạy offline)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
